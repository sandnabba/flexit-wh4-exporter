# Local dashboard development: fake exporter -> Prometheus -> Grafana with the dashboard
# provisioned from ../grafana. No heat pump needed.
#
#   docker compose up -d
#   open http://127.0.0.1:13000/d/flexit-wh4      (anonymous admin, no login)
#
# After regenerating ../grafana/wh4-dashboard.json Grafana picks it up within ~10 s.
# The ":z" volume option relabels for SELinux (Fedora); it is ignored elsewhere.
services:
  fake-exporter:
    image: python:3.13.18-slim
    command: ["python", "-u", "/dev-stack/fake_exporter.py", "/dev-stack/sample-metrics.txt"]
    volumes: ["./:/dev-stack:ro,z"]
  prometheus:
    image: prom/prometheus:v3.13.5
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z"]
    ports: ["127.0.0.1:19090:9090"]
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning:ro,z
      - ../grafana:/var/lib/grafana/dashboards:ro,z
    ports: ["127.0.0.1:13000:3000"]
